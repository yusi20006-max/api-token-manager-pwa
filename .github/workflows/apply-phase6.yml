name: apply-phase6
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and apply Phase 6 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Yousef"
          git config user.email "yusi20006@gmail.com"
          # Fetch the phase6 version from the commit on branch if available, else apply inline python transform
          python3 << 'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          # Marker: if already phase6, skip
          if 'token-row' in html and 'statusChips' in html:
              print('Already Phase 6')
              raise SystemExit(0)
          print('Phase 6 markers missing; need full file')
          raise SystemExit(1)
          PY
