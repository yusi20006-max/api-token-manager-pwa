name: Phase 6.1 implementation

on:
  push:
    branches: [fix/phase6-1-progressive-disclosure]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compact progressive disclosure fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function toggleDetails(id) {\n  const el = document.getElementById('details-' + id);\n  if (!el) return;\n  el.classList.toggle('open');\n  const btn = document.querySelector('[data-details-btn="' + id + '"]');\n  if (btn) btn.textContent = el.classList.contains('open') ? 'بستن' : 'مشخصات';\n}'''
          new = '''function toggleDetails(id) {\n  const el = document.getElementById('details-' + id);\n  if (!el) return;\n  const wasOpen = el.classList.contains('open');\n  document.querySelectorAll('.card-details.open').forEach(other => {\n    other.classList.remove('open');\n    const otherId = other.id.replace(/^details-/, '');\n    const otherBtn = document.querySelector('[data-details-btn="' + otherId + '"]');\n    if (otherBtn) {\n      otherBtn.textContent = 'مشخصات';\n      otherBtn.setAttribute('aria-expanded', 'false');\n    }\n  });\n  if (!wasOpen) {\n    el.classList.add('open');\n    const btn = document.querySelector('[data-details-btn="' + id + '"]');\n    if (btn) {\n      btn.textContent = 'بستن';\n      btn.setAttribute('aria-expanded', 'true');\n    }\n  }\n}'''
          if old not in s:
            raise SystemExit('toggleDetails source not found')
          s = s.replace(old, new, 1)
          old_btn = '''<button class="btn-ghost btn-sm" data-details-btn="${api.id}" onclick="toggleDetails('${api.id}')">مشخصات</button>'''
          new_btn = '''<button class="btn-ghost btn-sm" data-details-btn="${api.id}" aria-expanded="false" aria-controls="details-${api.id}" onclick="toggleDetails('${api.id}')">مشخصات</button>'''
          if old_btn not in s:
            raise SystemExit('details button source not found')
          s = s.replace(old_btn, new_btn, 1)
          old_provider = ''' <span style="font-weight:400;font-size:.75rem;color:var(--text-muted)">(${escapeHtml(api.providerId || 'custom')})</span>'''
          if old_provider in s:
            s = s.replace(old_provider, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run tests
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(phase6.1): enforce exclusive progressive disclosure' || exit 0
          git push
      - name: Verify patch
        run: |
          grep -q 'aria-expanded="false"' index.html
          grep -q 'document.querySelectorAll(\x27.card-details.open\x27)' index.html
          ! grep -q 'font-weight:400;font-size:.75rem;color:var(--text-muted)\">(\${escapeHtml(api.providerId' index.html
