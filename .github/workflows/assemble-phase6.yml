name: assemble-phase6

on:
  push:
    branches: [main]

jobs:
  validate-phase61:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase6-1-progressive-disclosure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: npm test
      - name: Validate Phase 6.1 markers
        run: |
          grep -q 'document.querySelectorAll(\x27.card-details.open\x27)' index.html
          grep -q 'aria-expanded="false"' index.html
          ! grep -q 'font-weight:400;font-size:.75rem;color:var(--text-muted)\">(\${escapeHtml(api.providerId' index.html
