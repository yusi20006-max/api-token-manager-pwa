name: Phase 6.2 details button fix

on:
  push:
    branches: [fix/phase6-2-details-button]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix module-scope inline handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function toggleDetails(id) {'
          new = 'window.toggleDetails = function toggleDetails(id) {'
          if old not in s:
              raise SystemExit('toggleDetails function not found')
          if new not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Add regression test
        run: |
          cat > /tmp/check-details.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          const s = readFileSync('index.html', 'utf8');
          if (!s.includes('<script type="module">')) throw new Error('module script missing');
          if (!s.includes('window.toggleDetails = function toggleDetails(id)')) throw new Error('toggleDetails is not globally exposed');
          if (!s.includes('data-details-btn="${api.id}" aria-expanded="false"')) throw new Error('details control wiring missing');
          if (!s.includes('document.querySelectorAll(\'.card-details.open\')')) throw new Error('exclusive disclosure logic missing');
          console.log('DETAILS_WIRING_OK');
          EOF
          node /tmp/check-details.mjs
      - name: Run full tests
        run: npm test
      - name: Commit fix
        run: |
          git config user.name 'Yasin Autonomous Agent'
          git config user.email 'yasin-autonomous-agent@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(phase6.2): expose details handler globally' || exit 0
          git push origin HEAD:fix/phase6-2-details-button
      - name: Verify working tree
        run: git status --short