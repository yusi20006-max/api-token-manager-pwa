name: Phase 6.3 Debug

on:
  push:
    branches:
      - fix/phase6-3-lossless-backup-restore

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused test and capture output
        run: |
          set +e
          node --test tests/backup-restore.test.js > /tmp/test-output.txt 2>&1
          code=$?
          cp /tmp/test-output.txt ci-phase63-test-output.txt
          git config user.name "phase63-ci"
          git config user.email "phase63-ci@users.noreply.github.com"
          git add ci-phase63-test-output.txt
          git commit -m "test(phase6.3): capture regression output" || true
          git push origin HEAD:fix/phase6-3-lossless-backup-restore
          exit $code
