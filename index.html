<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="مدیریت امن و محلی توکن‌های API با قابلیت چک وضعیت" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>مدیر توکن‌های API</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Vazirmatn", "Tahoma", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clock {
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button, .btn {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg-input); color: var(--text); }

    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .search-box:focus { outline: 2px solid var(--primary); }

    .cards {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .card.status-ok { border-color: color-mix(in srgb, var(--success) 50%, var(--border)); }
    .card.status-error { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
    .card.status-checking { border-color: color-mix(in srgb, var(--warning) 50%, var(--border)); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-ok { background: color-mix(in srgb, var(--success) 20%, transparent); color: var(--success); }
    .badge-error { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
    .badge-unknown { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-muted); }
    .badge-checking { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .field-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .field-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 70px;
    }

    .field-value {
      flex: 1;
      background: var(--bg-input);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-family: ui-monospace, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: ltr;
      text-align: left;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .last-msg {
      font-size: 0.8rem;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg-input);
      color: var(--text-muted);
      word-break: break-word;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .form-group textarea { min-height: 70px; resize: vertical; }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      z-index: 200;
      transition: transform 0.3s;
      font-size: 0.9rem;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 40px;
      padding: 0 16px;
    }

    @media (max-width: 500px) {
      .header h1 { font-size: 1rem; }
      .field-row { flex-direction: column; align-items: stretch; }
      .field-label { min-width: auto; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🔑 مدیر توکن‌های API</h1>
    <div class="clock" id="clock">--:--:--</div>
    <div class="header-actions">
      <button class="btn-ghost btn-sm" id="themeBtn" title="تغییر تم">🌅</button>
      <button class="btn-ghost btn-sm" id="exportBtn" title="خروجی JSON">⬇️</button>
      <button class="btn-ghost btn-sm" id="importBtn" title="ورود JSON">⬆️</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input type="search" class="search-box" id="searchInput" placeholder="جستجو بر اساس نام یا آدرس..." />
      <button class="btn-primary" id="addBtn">＋ افزودن API</button>
      <button class="btn-ghost" id="checkAllBtn">✓ چک همه</button>
    </div>

    <div class="cards" id="cards"></div>

    <div class="empty" id="emptyState" style="display:none;">
      <div style="font-size:3rem;">🗝️</div>
      <p>هنوز هیچ API ثبت نشده.<br>اولین توکن را اضافه کنید.</p>
    </div>

    <p class="footer-note">
      همه داده‌ها فقط در مرورگر شما ذخیره می‌شوند (LocalStorage).<br>
      به دلیل محدودیت CORS ممکن است برخی APIها از داخل مرورگر قابل تست نباشند حتی اگر کلید معتبر باشد.
    </p>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modalTitle">افزودن API جدید</h2>
      <form id="apiForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label for="name">نام / برچسب *</label>
          <input type="text" id="name" required placeholder="مثلاً OpenAI یا Claude" />
        </div>
        <div class="form-group">
          <label for="baseUrl">Base URL *</label>
          <input type="url" id="baseUrl" required placeholder="https://api.openai.com/v1" dir="ltr" />
        </div>
        <div class="form-group">
          <label for="apiKey">API Key / Token *</label>
          <input type="password" id="apiKey" required placeholder="sk-..." dir="ltr" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="testEndpoint">آدرس تست (اختیاری)</label>
          <input type="text" id="testEndpoint" placeholder="/models یا مسیر کامل" dir="ltr" />
        </div>
        <div class="form-group">
          <label for="notes">یادداشت</label>
          <textarea id="notes" placeholder="توضیحات اختیاری..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancelBtn">انصراف</button>
          <button type="submit" class="btn-primary">ذخیره</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'api-token-manager-v1';
    let apis = [];
    let editId = null;

    const $ = (sel) => document.querySelector(sel);

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function toast(msg, ms = 2200) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    function formatTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleString('fa-IR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function maskKey(key) {
      if (!key || key.length < 8) return '••••••••';
      return key.slice(0, 4) + '••••' + key.slice(-4);
    }

    function updateClock() {
      const now = new Date();
      $('#clock').textContent = now.toLocaleTimeString('fa-IR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        apis = raw ? JSON.parse(raw) : [];
      } catch {
        apis = [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(apis));
    }

    function initTheme() {
      const saved = localStorage.getItem('atm-theme') || 'dark';
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    }

    $('#themeBtn').addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('atm-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('atm-theme', 'light');
      }
    });

    function render() {
      const q = ($('#searchInput').value || '').trim().toLowerCase();
      const filtered = apis.filter(a =>
        !q ||
        (a.name || '').toLowerCase().includes(q) ||
        (a.baseUrl || '').toLowerCase().includes(q) ||
        (a.notes || '').toLowerCase().includes(q)
      );

      const container = $('#cards');
      const empty = $('#emptyState');

      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        empty.querySelector('p').innerHTML = apis.length === 0
          ? 'هنوز هیچ API ثبت نشده.<br>اولین توکن را اضافه کنید.'
          : 'نتیجه‌ای یافت نشد.';
        return;
      }
      empty.style.display = 'none';

      container.innerHTML = filtered.map(api => {
        const statusClass = api.status || 'unknown';
        const badgeClass = `badge-${statusClass}`;
        const badgeText = {
          ok: 'اوکی',
          error: 'خراب',
          checking: 'در حال چک',
          unknown: 'نامشخص'
        }[statusClass] || 'نامشخص';

        return `
          <article class="card status-${statusClass}" data-id="${api.id}">
            <div class="card-header">
              <div class="card-title">
                ${escapeHtml(api.name)}
                <span class="badge ${badgeClass}">${badgeText}</span>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn-ghost btn-sm" onclick="editApi('${api.id}')">ویرایش</button>
                <button class="btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteApi('${api.id}')">حذف</button>
              </div>
            </div>
            <div class="card-meta">
              آخرین چک: ${formatTime(api.lastChecked)}
            </div>
            <div class="field-row">
              <span class="field-label">Base URL</span>
              <div class="field-value" title="${escapeHtml(api.baseUrl)}">${escapeHtml(api.baseUrl)}</div>
              <button class="btn-ghost btn-sm" onclick="copyText('${escapeAttr(api.baseUrl)}')">کپی</button>
            </div>
            <div class="field-row">
              <span class="field-label">Token</span>
              <div class="field-value" id="key-${api.id}">${maskKey(api.apiKey)}</div>
              <button class="btn-ghost btn-sm" onclick="toggleKey('${api.id}')">👁</button>
              <button class="btn-ghost btn-sm" onclick="copyText('${escapeAttr(api.apiKey)}')">کپی</button>
            </div>
            ${api.notes ? `<div class="card-meta" style="margin-top:6px;">📝 ${escapeHtml(api.notes)}</div>` : ''}
            ${api.lastMessage ? `<div class="last-msg">${escapeHtml(api.lastMessage)}</div>` : ''}
            <div class="card-actions">
              <button class="btn-primary btn-sm" onclick="checkOne('${api.id}')">چک کردن</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');
    }

    function openModal(id = null) {
      editId = id;
      const modal = $('#modal');
      const form = $('#apiForm');
      form.reset();
      $('#editId').value = '';

      if (id) {
        const api = apis.find(a => a.id === id);
        if (!api) return;
        $('#modalTitle').textContent = 'ویرایش API';
        $('#editId').value = id;
        $('#name').value = api.name || '';
        $('#baseUrl').value = api.baseUrl || '';
        $('#apiKey').value = api.apiKey || '';
        $('#testEndpoint').value = api.testEndpoint || '';
        $('#notes').value = api.notes || '';
      } else {
        $('#modalTitle').textContent = 'افزودن API جدید';
      }
      modal.classList.add('open');
      $('#name').focus();
    }

    function closeModal() {
      $('#modal').classList.remove('open');
      editId = null;
    }

    $('#addBtn').addEventListener('click', () => openModal());
    $('#cancelBtn').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', (e) => {
      if (e.target === $('#modal')) closeModal();
    });

    $('#apiForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        name: $('#name').value.trim(),
        baseUrl: $('#baseUrl').value.trim().replace(/\/$/, ''),
        apiKey: $('#apiKey').value.trim(),
        testEndpoint: $('#testEndpoint').value.trim(),
        notes: $('#notes').value.trim()
      };

      if (!data.name || !data.baseUrl || !data.apiKey) {
        toast('فیلدهای ضروری را پر کنید');
        return;
      }

      const id = $('#editId').value;
      if (id) {
        const idx = apis.findIndex(a => a.id === id);
        if (idx !== -1) {
          apis[idx] = { ...apis[idx], ...data };
        }
      } else {
        apis.unshift({
          id: uid(),
          ...data,
          status: 'unknown',
          lastChecked: null,
          lastMessage: null,
          createdAt: Date.now()
        });
      }
      save();
      render();
      closeModal();
      toast(id ? 'ویرایش شد' : 'اضافه شد');
    });

    window.editApi = (id) => openModal(id);

    window.deleteApi = (id) => {
      if (!confirm('این API حذف شود؟')) return;
      apis = apis.filter(a => a.id !== id);
      save();
      render();
      toast('حذف شد');
    };

    window.toggleKey = (id) => {
      const api = apis.find(a => a.id === id);
      if (!api) return;
      const el = document.getElementById(`key-${id}`);
      if (!el) return;
      if (el.dataset.shown === '1') {
        el.textContent = maskKey(api.apiKey);
        el.dataset.shown = '0';
      } else {
        el.textContent = api.apiKey;
        el.dataset.shown = '1';
      }
    };

    window.copyText = async (text) => {
      try {
        await navigator.clipboard.writeText(text);
        toast('کپی شد ✓');
      } catch {
        toast('کپی ناموفق');
      }
    };

    async function performCheck(api) {
      api.status = 'checking';
      api.lastMessage = 'در حال ارسال درخواست...';
      render();

      let url = api.baseUrl;
      if (api.testEndpoint) {
        if (api.testEndpoint.startsWith('http')) {
          url = api.testEndpoint;
        } else {
          url = api.baseUrl.replace(/\/$/, '') + '/' + api.testEndpoint.replace(/^\//, '');
        }
      }

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      try {
        const headers = {
          'Accept': 'application/json',
        };
        if (api.apiKey.toLowerCase().startsWith('sk-') || api.apiKey.length > 20) {
          headers['Authorization'] = `Bearer ${api.apiKey}`;
        }
        headers['x-api-key'] = api.apiKey;

        const res = await fetch(url, {
          method: 'GET',
          headers,
          signal: controller.signal,
          mode: 'cors'
        });

        clearTimeout(timeout);

        const text = await res.text().catch(() => '');
        const short = text.slice(0, 120).replace(/\s+/g, ' ');

        if (res.ok) {
          api.status = 'ok';
          api.lastMessage = `✓ ${res.status} — ${short || 'OK'}`;
        } else {
          api.status = 'error';
          api.lastMessage = `✗ ${res.status} ${res.statusText} — ${short}`;
        }
      } catch (err) {
        clearTimeout(timeout);
        api.status = 'error';
        if (err.name === 'AbortError') {
          api.lastMessage = '✗ تایم‌اوت (۱۲ ثانیه)';
        } else if (err.message && err.message.includes('Failed to fetch')) {
          api.lastMessage = '✗ CORS یا شبکه — ممکن است کلید معتبر باشد اما از مرورگر قابل تست نباشد';
        } else {
          api.lastMessage = `✗ ${err.message || 'خطای ناشناخته'}`;
        }
      }

      api.lastChecked = Date.now();
      save();
      render();
    }

    window.checkOne = (id) => {
      const api = apis.find(a => a.id === id);
      if (api) performCheck(api);
    };

    $('#checkAllBtn').addEventListener('click', async () => {
      if (apis.length === 0) {
        toast('لیست خالی است');
        return;
      }
      toast('شروع چک همه...');
      for (const api of apis) {
        await performCheck(api);
      }
      toast('چک همه تمام شد');
    });

    $('#searchInput').addEventListener('input', render);

    $('#exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(apis, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `api-tokens-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('فایل دانلود شد');
    });

    $('#importBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('فرمت نامعتبر');
          if (!confirm(`${data.length} مورد وارد شود؟ (لیست فعلی جایگزین می‌شود)`)) return;
          apis = data.map(item => ({
            id: item.id || uid(),
            name: item.name || 'بدون نام',
            baseUrl: item.baseUrl || '',
            apiKey: item.apiKey || '',
            testEndpoint: item.testEndpoint || '',
            notes: item.notes || '',
            status: item.status || 'unknown',
            lastChecked: item.lastChecked || null,
            lastMessage: item.lastMessage || null,
            createdAt: item.createdAt || Date.now()
          }));
          save();
          render();
          toast('وارد شد');
        } catch (e) {
          toast('خطا در خواندن فایل');
        }
      };
      input.click();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    initTheme();
    load();
    render();
  </script>
</body>
</html>
