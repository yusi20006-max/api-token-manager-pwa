<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<title>مدیر توکن‌های API</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{--bg:#0f172a;--bg-card:#1e293b;--bg-input:#334155;--text:#f1f5f9;--text-muted:#94a3b8;--primary:#3b82f6;--primary-hover:#2563eb;--success:#22c55e;--danger:#ef4444;--warning:#eab308;--border:#334155;--radius:12px;--shadow:0 4px 20px rgba(0,0,0,.3)}
[data-theme=light]{--bg:#f8fafc;--bg-card:#fff;--bg-input:#f1f5f9;--text:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--shadow:0 4px 20px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.6}
.header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header h1{font-size:1.1rem;font-weight:700}.clock{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--text-muted);background:var(--bg-card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.header-actions{display:flex;gap:8px}button,.btn{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:.875rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg-input);color:var(--text)}.btn-sm{padding:5px 10px;font-size:.8rem}.btn-active{background:color-mix(in srgb,var(--success) 25%,transparent);color:var(--success);border-color:var(--success)}
main{max-width:920px;margin:0 auto;padding:16px 16px 80px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.search-box{flex:1;min-width:160px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:.9rem}
.auto-box{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.85rem}
.auto-box select{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-family:inherit;font-size:.8rem}
.cards{display:grid;gap:14px}.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}.card.status-ok{border-color:color-mix(in srgb,var(--success) 45%,var(--border))}.card.status-error{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}.card.status-checking{border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.card-title{font-size:1.02rem;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.68rem;padding:2px 8px;border-radius:999px;font-weight:600}.badge-ok{background:color-mix(in srgb,var(--success) 20%,transparent);color:var(--success)}.badge-error{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}.badge-unknown{background:color-mix(in srgb,var(--text-muted) 20%,transparent);color:var(--text-muted)}.badge-checking{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--warning)}
.card-meta{font-size:.78rem;color:var(--text-muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px}.field-row{display:flex;gap:8px;margin-bottom:7px;align-items:center}.field-label{font-size:.72rem;color:var(--text-muted);min-width:68px}.field-value{flex:1;background:var(--bg-input);border-radius:6px;padding:5px 10px;font-size:.82rem;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.last-msg{font-size:.78rem;margin-top:8px;padding:7px 10px;border-radius:6px;background:var(--bg-input);color:var(--text-muted);word-break:break-word}
.history{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}.history summary{cursor:pointer;font-size:.8rem;color:var(--text-muted)}.history-list{margin-top:6px;font-size:.75rem;color:var(--text-muted);max-height:160px;overflow-y:auto}.history-item{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}.hist-ok{color:var(--success)}.hist-err{color:var(--danger)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;opacity:0;visibility:hidden;transition:all .2s}.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:var(--bg-card);border-radius:var(--radius);width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow)}.modal h2{font-size:1.15rem;margin-bottom:14px}.form-group{margin-bottom:13px}.form-group label{display:block;font-size:.84rem;margin-bottom:4px;color:var(--text-muted)}.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:.9rem}.form-group textarea{min-height:64px;resize:vertical}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-card);border:1px solid var(--border);padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:200;transition:transform .3s;font-size:.9rem}.toast.show{transform:translateX(-50%) translateY(0)}.footer-note{text-align:center;font-size:.72rem;color:var(--text-muted);margin-top:36px;padding:0 12px}
@media(max-width:520px){.header h1{font-size:.95rem}.field-row{flex-direction:column;align-items:stretch}.field-label{min-width:auto}}
</style>
</head>
<body>
<header class="header"><h1>🔑 مدیر توکن‌های API</h1><div class="clock" id="clock">--:--:--</div><div class="header-actions"><button class="btn-ghost btn-sm" id="themeBtn">🌅</button><button class="btn-ghost btn-sm" id="exportBtn">⬇️</button><button class="btn-ghost btn-sm" id="importBtn">⬆️</button></div></header>
<main>
<div class="toolbar">
<input type="search" class="search-box" id="searchInput" placeholder="جستجو..."/>
<button class="btn-primary" id="addBtn">＋ افزودن</button>
<button class="btn-ghost" id="checkAllBtn">✓ چک همه</button>
<div class="auto-box"><button class="btn-ghost btn-sm" id="autoBtn">⏱ خودکار</button>
<select id="autoInterval"><option value="5">۵ دقیقه</option><option value="15" selected>۱۵ دقیقه</option><option value="30">۳۰ دقیقه</option><option value="60">۶۰ دقیقه</option></select></div>
</div>
<div class="cards" id="cards"></div>
<div class="empty" id="emptyState" style="display:none"><div style="font-size:2.8rem">🗝️</div><p>هنوز هیچ API ثبت نشده.</p></div>
<p class="footer-note">همه داده‌ها فقط در مرورگر شما ذخیره می‌شوند. به دلیل CORS ممکن است برخی APIها قابل تست نباشند.</p>
</main>
<div class="modal-overlay" id="modal"><div class="modal"><h2 id="modalTitle">افزودن API</h2>
<form id="apiForm">
<input type="hidden" id="editId"/>
<div class="form-group"><label for="name">نام *</label><input type="text" id="name" required placeholder="OpenAI / Claude"/></div>
<div class="form-group"><label for="baseUrl">Base URL *</label><input type="url" id="baseUrl" required placeholder="https://api.openai.com/v1" dir="ltr"/></div>
<div class="form-group"><label for="apiKey">API Key *</label><input type="password" id="apiKey" required placeholder="sk-..." dir="ltr" autocomplete="off"/></div>
<div class="form-group"><label for="authType">روش احراز هویت</label><select id="authType"><option value="bearer">Bearer</option><option value="x-api-key">x-api-key</option><option value="query">Query</option><option value="none">بدون</option></select></div>
<div class="form-group"><label for="model">مدل هوش مصنوعی (اختیاری)</label><input type="text" id="model" placeholder="gpt-4o-mini / gemini-1.5-flash" dir="ltr"/></div>
<div class="form-group"><label for="testEndpoint">آدرس تست (اختیاری)</label><input type="text" id="testEndpoint" placeholder="/models" dir="ltr"/></div>
<div class="form-group"><label for="notes">یادداشت</label><textarea id="notes"></textarea></div>
<div class="form-actions"><button type="button" class="btn-ghost" id="cancelBtn">انصراف</button><button type="submit" class="btn-primary">ذخیره</button></div>
</form></div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='api-token-manager-v3',MAX_HISTORY=10;let apis=[],editId=null,autoTimer=null,autoEnabled=false;
const $=s=>document.querySelector(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms)}
function formatTime(ts){if(!ts)return'—';return new Date(ts).toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function formatShortTime(ts){if(!ts)return'—';return new Date(ts).toLocaleString('fa-IR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function maskKey(k){if(!k||k.length<8)return'••••••••';return k.slice(0,4)+'••••'+k.slice(-4)}
function updateClock(){$('#clock').textContent=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(updateClock,1000);updateClock();
function load(){try{const r=localStorage.getItem(STORAGE_KEY);apis=r?JSON.parse(r):[];apis=apis.map(a=>({authType:a.authType||'bearer',model:a.model||'',history:a.history||[],lastLatency:a.lastLatency||null,...a}))}catch{apis=[]}const s=localStorage.getItem('atm-auto');if(s){try{const o=JSON.parse(s);autoEnabled=!!o.enabled;if(o.interval)$('#autoInterval').value=String(o.interval)}catch{}}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(apis));localStorage.setItem('atm-auto',JSON.stringify({enabled:autoEnabled,interval:Number($('#autoInterval').value)||15}))}
function initTheme(){if((localStorage.getItem('atm-theme')||'dark')==='light')document.documentElement.setAttribute('data-theme','light')}
$('#themeBtn').onclick=()=>{const l=document.documentElement.getAttribute('data-theme')==='light';if(l){document.documentElement.removeAttribute('data-theme');localStorage.setItem('atm-theme','dark')}else{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('atm-theme','light')}};
function authLabel(t){return{bearer:'Bearer','x-api-key':'x-api-key',query:'Query',none:'بدون'}[t]||t}
function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"')}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;')}
function render(){const q=($('#searchInput').value||'').trim().toLowerCase();const f=apis.filter(a=>!q||(a.name||'').toLowerCase().includes(q)||(a.baseUrl||'').toLowerCase().includes(q)||(a.notes||'').toLowerCase().includes(q)||(a.model||'').toLowerCase().includes(q));const c=$('#cards'),e=$('#emptyState');if(!f.length){c.innerHTML='';e.style.display='block';e.querySelector('p').innerHTML=apis.length?'نتیجه‌ای یافت نشد.':'هنوز هیچ API ثبت نشده.';return}e.style.display='none';c.innerHTML=f.map(api=>{const st=api.status||'unknown';const bt={ok:'اوکی',error:'خراب',checking:'در حال چک',unknown:'نامشخص'}[st]||'نامشخص';const lat=api.lastLatency!=null?api.lastLatency+' ms':'—';const hist=(api.history||[]).slice().reverse();const histHtml=hist.length?`<details class="history"><summary>تاریخچه (${hist.length})</summary><div class="history-list">${hist.map(h=>`<div class="history-item"><span class="${h.status==='ok'?'hist-ok':'hist-err'}">${h.status==='ok'?'✓':'✗'}</span><span>${formatShortTime(h.time)}</span><span>${h.latency!=null?h.latency+'ms':'—'}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml((h.message||'').slice(0,50))}</span></div>`).join('')}</div></details>`:'';return `<article class="card status-${st}"><div class="card-header"><div class="card-title">${escapeHtml(api.name)}<span class="badge badge-${st}">${bt}</span></div><div style="display:flex;gap:6px"><button class="btn-ghost btn-sm" onclick="editApi('${api.id}')">ویرایش</button><button class="btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteApi('${api.id}')">حذف</button></div></div><div class="card-meta"><span>آخرین چک: ${formatTime(api.lastChecked)}</span><span>تأخیر: ${lat}</span><span>احراز: ${authLabel(api.authType||'bearer')}</span>${api.model?`<span>مدل: ${escapeHtml(api.model)}</span>`:''}</div><div class="field-row"><span class="field-label">Base URL</span><div class="field-value">${escapeHtml(api.baseUrl)}</div><button class="btn-ghost btn-sm" onclick="copyText('${escapeAttr(api.baseUrl)}')">کپی</button></div><div class="field-row"><span class="field-label">Token</span><div class="field-value" id="key-${api.id}">${maskKey(api.apiKey)}</div><button class="btn-ghost btn-sm" onclick="toggleKey('${api.id}')">👁</button><button class="btn-ghost btn-sm" onclick="copyText('${escapeAttr(api.apiKey)}')">کپی</button></div>${api.notes?`<div class="card-meta">📝 ${escapeHtml(api.notes)}</div>`:''}${api.lastMessage?`<div class="last-msg">${escapeHtml(api.lastMessage)}</div>`:''}${histHtml}<div class="card-actions"><button class="btn-primary btn-sm" onclick="checkOne('${api.id}')">چک کردن</button></div></article>`}).join('')}
function openModal(id=null){editId=id;$('#apiForm').reset();$('#editId').value='';$('#authType').value='bearer';$('#model').value='';if(id){const api=apis.find(a=>a.id===id);if(!api)return;$('#modalTitle').textContent='ویرایش';$('#editId').value=id;$('#name').value=api.name||'';$('#baseUrl').value=api.baseUrl||'';$('#apiKey').value=api.apiKey||'';$('#authType').value=api.authType||'bearer';$('#model').value=api.model||'';$('#testEndpoint').value=api.testEndpoint||'';$('#notes').value=api.notes||''}else $('#modalTitle').textContent='افزودن API';$('#modal').classList.add('open');$('#name').focus()}
function closeModal(){$('#modal').classList.remove('open');editId=null}
$('#addBtn').onclick=()=>openModal();$('#cancelBtn').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
$('#apiForm').onsubmit=e=>{e.preventDefault();const data={name:$('#name').value.trim(),baseUrl:$('#baseUrl').value.trim().replace(/\/$/,''),apiKey:$('#apiKey').value.trim(),authType:$('#authType').value||'bearer',model:$('#model').value.trim(),testEndpoint:$('#testEndpoint').value.trim(),notes:$('#notes').value.trim()};if(!data.name||!data.baseUrl||!data.apiKey){toast('فیلدهای ضروری');return}const id=$('#editId').value;if(id){const i=apis.findIndex(a=>a.id===id);if(i!==-1)apis[i]={...apis[i],...data}}else apis.unshift({id:uid(),...data,status:'unknown',lastChecked:null,lastMessage:null,lastLatency:null,history:[],createdAt:Date.now()});save();render();closeModal();toast(id?'ویرایش شد':'اضافه شد')};
window.editApi=id=>openModal(id);window.deleteApi=id=>{if(!confirm('حذف شود؟'))return;apis=apis.filter(a=>a.id!==id);save();render();toast('حذف شد')};
window.toggleKey=id=>{const api=apis.find(a=>a.id===id);if(!api)return;const el=document.getElementById('key-'+id);if(!el)return;if(el.dataset.shown==='1'){el.textContent=maskKey(api.apiKey);el.dataset.shown='0'}else{el.textContent=api.apiKey;el.dataset.shown='1'}};
window.copyText=async t=>{try{await navigator.clipboard.writeText(t);toast('کپی شد')}catch{toast('کپی ناموفق')}};
function buildRequest(api){let url=api.baseUrl;if(api.testEndpoint){url=api.testEndpoint.startsWith('http')?api.testEndpoint:api.baseUrl.replace(/\/$/,'')+'/'+api.testEndpoint.replace(/^\//,'')}else if(api.model){const b=api.baseUrl.replace(/\/$/,'');url=b.endsWith('/v1')?b+'/models':b+'/v1/models'}const headers={'Accept':'application/json'};const auth=api.authType||'bearer';if(auth==='bearer')headers['Authorization']='Bearer '+api.apiKey;else if(auth==='x-api-key')headers['x-api-key']=api.apiKey;else if(auth==='query'){const sep=url.includes('?')?'&':'?';url=url+sep+'key='+encodeURIComponent(api.apiKey)}return{url,headers}}
async function performCheck(api){api.status='checking';api.lastMessage='در حال ارسال...';render();const{url,headers}=buildRequest(api);const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),12000);const t0=performance.now();try{const res=await fetch(url,{method:'GET',headers,signal:ctrl.signal,mode:'cors'});clearTimeout(to);const latency=Math.round(performance.now()-t0);const text=await res.text().catch(()=>'');const short=text.slice(0,100).replace(/\s+/g,' ');if(res.ok){if(api.model&&text){const found=text.toLowerCase().includes(api.model.toLowerCase());if(found){api.status='ok';api.lastMessage='✓ مدل «'+api.model+'» پیدا شد — '+latency+'ms'}else{api.status='error';api.lastMessage='✗ کلید اوکی است ولی مدل «'+api.model+'» نبود — '+latency+'ms'}}else{api.status='ok';api.lastMessage='✓ '+res.status+' — '+latency+'ms — '+(short||'OK')}}else{api.status='error';api.lastMessage='✗ '+res.status+' '+res.statusText+' — '+latency+'ms — '+short}api.lastLatency=latency;pushHistory(api,api.status,api.lastMessage,latency,res.status)}catch(err){clearTimeout(to);const latency=Math.round(performance.now()-t0);api.status='error';api.lastLatency=latency;if(err.name==='AbortError')api.lastMessage='✗ تایم‌اوت — '+latency+'ms';else if(err.message&&err.message.includes('Failed to fetch'))api.lastMessage='✗ CORS/شبکه — '+latency+'ms';else api.lastMessage='✗ '+(err.message||'خطا')+' — '+latency+'ms';pushHistory(api,'error',api.lastMessage,latency,null)}api.lastChecked=Date.now();save();render()}
function pushHistory(api,status,message,latency,httpStatus){if(!api.history)api.history=[];api.history.push({time:Date.now(),status,message:(message||'').slice(0,200),latency,httpStatus});if(api.history.length>MAX_HISTORY)api.history=api.history.slice(-MAX_HISTORY)}
window.checkOne=id=>{const api=apis.find(a=>a.id===id);if(api)performCheck(api)};
$('#checkAllBtn').onclick=async()=>{if(!apis.length){toast('لیست خالی');return}toast('شروع چک...');for(const api of apis)await performCheck(api);toast('تمام')};
function updateAutoBtn(){const b=$('#autoBtn');if(autoEnabled){b.classList.add('btn-active');b.textContent='⏱ روشن'}else{b.classList.remove('btn-active');b.textContent='⏱ خودکار'}}
function startAuto(){stopAuto();const m=Number($('#autoInterval').value)||15;autoTimer=setInterval(async()=>{if(!apis.length)return;for(const api of apis)await performCheck(api)},m*60*1000)}
function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}}
$('#autoBtn').onclick=()=>{autoEnabled=!autoEnabled;if(autoEnabled){startAuto();toast('خودکار فعال')}else{stopAuto();toast('خاموش')}updateAutoBtn();save()};
$('#autoInterval').onchange=()=>{if(autoEnabled)startAuto();save()};$('#searchInput').oninput=render;
$('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(apis,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='api-tokens-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('دانلود')};
$('#importBtn').onclick=()=>{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data))throw 0;if(!confirm(data.length+' مورد وارد شود؟'))return;apis=data.map(item=>({id:item.id||uid(),name:item.name||'بدون نام',baseUrl:item.baseUrl||'',apiKey:item.apiKey||'',authType:item.authType||'bearer',model:item.model||'',testEndpoint:item.testEndpoint||'',notes:item.notes||'',status:item.status||'unknown',lastChecked:item.lastChecked||null,lastMessage:item.lastMessage||null,lastLatency:item.lastLatency||null,history:Array.isArray(item.history)?item.history.slice(-MAX_HISTORY):[],createdAt:item.createdAt||Date.now()}));save();render();toast('وارد شد')}catch{toast('خطا')}};input.click()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
initTheme();load();updateAutoBtn();if(autoEnabled)startAuto();render();
</script>
</body>
</html>
