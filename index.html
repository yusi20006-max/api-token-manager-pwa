<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="مدیریت امن و محلی توکن‌های API با قابلیت چک وضعیت" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>مدیر توکن‌های API</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Vazirmatn", "Tahoma", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    .header {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .clock {
      font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--text-muted);
      background: var(--bg-card); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    button, .btn {
      font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 0.875rem; font-weight: 500; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-input); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
    .btn-active { background: color-mix(in srgb, var(--success) 25%, transparent); color: var(--success); border-color: var(--success); }
    main { max-width: 920px; margin: 0 auto; padding: 16px 16px 80px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
    .search-box {
      flex: 1; min-width: 160px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 0.9rem;
    }
    .search-box:focus { outline: 2px solid var(--primary); }
    .auto-box {
      display: flex; align-items: center; gap: 8px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem;
    }
    .auto-box select {
      background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 6px; font-family: inherit; font-size: 0.8rem;
    }
    .cards { display: grid; gap: 14px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow); transition: border-color 0.2s;
    }
    .card.status-ok { border-color: color-mix(in srgb, var(--success) 45%, var(--border)); }
    .card.status-error { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
    .card.status-checking { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-title { font-size: 1.02rem; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge-ok { background: color-mix(in srgb, var(--success) 20%, transparent); color: var(--success); }
    .badge-error { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
    .badge-unknown { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-muted); }
    .badge-checking { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
    .card-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
    .field-row { display: flex; gap: 8px; margin-bottom: 7px; align-items: center; }
    .field-label { font-size: 0.72rem; color: var(--text-muted); min-width: 68px; }
    .field-value {
      flex: 1; background: var(--bg-input); border-radius: 6px; padding: 5px 10px; font-size: 0.82rem;
      font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      direction: ltr; text-align: left;
    }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .last-msg { font-size: 0.78rem; margin-top: 8px; padding: 7px 10px; border-radius: 6px; background: var(--bg-input); color: var(--text-muted); word-break: break-word; }
    .history { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
    .history summary { cursor: pointer; font-size: 0.8rem; color: var(--text-muted); user-select: none; }
    .history-list { margin-top: 6px; font-size: 0.75rem; color: var(--text-muted); max-height: 160px; overflow-y: auto; }
    .history-item { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .history-item:last-child { border-bottom: none; }
    .hist-ok { color: var(--success); }
    .hist-err { color: var(--danger); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center;
      justify-content: center; z-index: 100; padding: 16px; opacity: 0; visibility: hidden; transition: all 0.2s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: var(--bg-card); border-radius: var(--radius); width: 100%; max-width: 480px;
      max-height: 90dvh; overflow-y: auto; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 14px; }
    .form-group { margin-bottom: 13px; }
    .form-group label { display: block; font-size: 0.84rem; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; color: var(--text); font-family: inherit; font-size: 0.9rem;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: 2px solid var(--primary); border-color: transparent;
    }
    .form-group textarea { min-height: 64px; resize: vertical; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--bg-card); border: 1px solid var(--border); padding: 12px 20px; border-radius: 10px;
      box-shadow: var(--shadow); z-index: 200; transition: transform 0.3s; font-size: 0.9rem;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .footer-note { text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 36px; padding: 0 12px; }
    @media (max-width: 520px) {
      .header h1 { font-size: 0.95rem; }
      .field-row { flex-direction: column; align-items: stretch; }
      .field-label { min-width: auto; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🔑 مدیر توکن‌های API</h1>
    <div class="clock" id="clock">--:--:--</div>
    <div class="header-actions">
      <button class="btn-ghost btn-sm" id="themeBtn" title="تغییر تم">🌅</button>
      <button class="btn-ghost btn-sm" id="exportBtn" title="خروجی JSON">⬇️</button>
      <button class="btn-ghost btn-sm" id="importBtn" title="ورود JSON">⬆️</button>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input type="search" class="search-box" id="searchInput" placeholder="جستجو بر اساس نام یا آدرس..." />
      <button class="btn-primary" id="addBtn">＋ افزودن</button>
      <button class="btn-ghost" id="checkAllBtn">✓ چک همه</button>
      <div class="auto-box">
        <button class="btn-ghost btn-sm" id="autoBtn" title="چک خودکار">⏱ خودکار</button>
        <select id="autoInterval" title="بازه زمانی">
          <option value="5">۵ دقیقه</option>
          <option value="15" selected>۱۵ دقیقه</option>
          <option value="30">۳۰ دقیقه</option>
          <option value="60">۶۰ دقیقه</option>
        </select>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="emptyState" style="display:none;">
      <div style="font-size:2.8rem;">🗝️</div>
      <p>هنوز هیچ API ثبت نشده.<br>اولین توکن را اضافه کنید.</p>
    </div>
    <p class="footer-note">
      همه داده‌ها فقط در مرورگر شما ذخیره می‌شوند.<br>
      به دلیل CORS ممکن است برخی APIها از مرورگر قابل تست نباشند حتی اگر کلید معتبر باشد.
    </p>
  </main>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modalTitle">افزودن API جدید</h2>
      <form id="apiForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label for="name">نام / برچسب *</label>
          <input type="text" id="name" required placeholder="مثلاً OpenAI یا Claude" />
        </div>
        <div class="form-group">
          <label for="baseUrl">Base URL *</label>
          <input type="url" id="baseUrl" required placeholder="https://api.openai.com/v1" dir="ltr" />
        </div>
        <div class="form-group">
          <label for="apiKey">API Key / Token *</label>
          <input type="password" id="apiKey" required placeholder="sk-..." dir="ltr" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="authType">روش احراز هویت</label>
          <select id="authType">
            <option value="bearer">Bearer Token (Authorization)</option>
            <option value="x-api-key">x-api-key Header</option>
            <option value="query">Query Parameter (?key=)</option>
            <option value="none">بدون هدر (فقط URL)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="testEndpoint">آدرس تست (اختیاری)</label>
          <input type="text" id="testEndpoint" placeholder="/models یا مسیر کامل" dir="ltr" />
        </div>
        <div class="form-group">
          <label for="notes">یادداشت</label>
          <textarea id="notes" placeholder="توضیحات اختیاری..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancelBtn">انصراف</button>
          <button type="submit" class="btn-primary">ذخیره</button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const STORAGE_KEY = 'api-token-manager-v2';
    const MAX_HISTORY = 10;
    let apis = [];
    let editId = null;
    let autoTimer = null;
    let autoEnabled = false;
    const $ = (sel) => document.querySelector(sel);
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function toast(msg, ms = 2200) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }
    function formatTime(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function formatShortTime(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('fa-IR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function maskKey(key) {
      if (!key || key.length < 8) return '••••••••';
      return key.slice(0, 4) + '••••' + key.slice(-4);
    }
    function updateClock() {
      $('#clock').textContent = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        apis = raw ? JSON.parse(raw) : [];
        apis = apis.map(a => ({ authType: a.authType || 'bearer', history: a.history || [], lastLatency: a.lastLatency || null, ...a }));
      } catch { apis = []; }
      const autoState = localStorage.getItem('atm-auto');
      if (autoState) {
        try {
          const s = JSON.parse(autoState);
          autoEnabled = !!s.enabled;
          if (s.interval) $('#autoInterval').value = String(s.interval);
        } catch {}
      }
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(apis));
      localStorage.setItem('atm-auto', JSON.stringify({ enabled: autoEnabled, interval: Number($('#autoInterval').value) || 15 }));
    }
    function initTheme() {
      const saved = localStorage.getItem('atm-theme') || 'dark';
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    }
    $('#themeBtn').addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('atm-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('atm-theme', 'light');
      }
    });
    function authLabel(type) {
      return { 'bearer': 'Bearer', 'x-api-key': 'x-api-key', 'query': 'Query', 'none': 'بدون' }[type] || type;
    }
    function render() {
      const q = ($('#searchInput').value || '').trim().toLowerCase();
      const filtered = apis.filter(a => !q || (a.name || '').toLowerCase().includes(q) || (a.baseUrl || '').toLowerCase().includes(q) || (a.notes || '').toLowerCase().includes(q));
      const container = $('#cards');
      const empty = $('#emptyState');
      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        empty.querySelector('p').innerHTML = apis.length === 0 ? 'هنوز هیچ API ثبت نشده.<br>اولین توکن را اضافه کنید.' : 'نتیجه‌ای یافت نشد.';
        return;
      }
      empty.style.display = 'none';
      container.innerHTML = filtered.map(api => {
        const statusClass = api.status || 'unknown';
        const badgeText = { ok: 'اوکی', error: 'خراب', checking: 'در حال چک', unknown: 'نامشخص' }[statusClass] || 'نامشخص';
        const latencyStr = api.lastLatency != null ? api.lastLatency + ' ms' : '—';
        const hist = (api.history || []).slice().reverse();
        const histHtml = hist.length ? `<details class="history"><summary>تاریخچه چک‌ها (${hist.length})</summary><div class="history-list">${hist.map(h => `<div class="history-item"><span class="${h.status === 'ok' ? 'hist-ok' : 'hist-err'}">${h.status === 'ok' ? '✓' : '✗'}</span><span>${formatShortTime(h.time)}</span><span>${h.latency != null ? h.latency + 'ms' : '—'}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(h.message || '')}">${escapeHtml((h.message || '').slice(0, 60))}</span></div>`).join('')}</div></details>` : '';
        return `<article class="card status-${statusClass}" data-id="${api.id}"><div class="card-header"><div class="card-title">${escapeHtml(api.name)}<span class="badge badge-${statusClass}">${badgeText}</span></div><div style="display:flex;gap:6px;"><button class="btn-ghost btn-sm" onclick="editApi('${api.id}')">ویرایش</button><button class="btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteApi('${api.id}')">حذف</button></div></div><div class="card-meta"><span>آخرین چک: ${formatTime(api.lastChecked)}</span><span>تأخیر: ${latencyStr}</span><span>احراز: ${authLabel(api.authType || 'bearer')}</span></div><div class="field-row"><span class="field-label">Base URL</span><div class="field-value" title="${escapeHtml(api.baseUrl)}">${escapeHtml(api.baseUrl)}</div><button class="btn-ghost btn-sm" onclick="copyText('${escapeAttr(api.baseUrl)}')">کپی</button></div><div class="field-row"><span class="field-label">Token</span><div class="field-value" id="key-${api.id}">${maskKey(api.apiKey)}</div><button class="btn-ghost btn-sm" onclick="toggleKey('${api.id}')">👁</button><button class="btn-ghost btn-sm" onclick="copyText('${escapeAttr(api.apiKey)}')">کپی</button></div>${api.notes ? `<div class="card-meta" style="margin-top:4px;">📝 ${escapeHtml(api.notes)}</div>` : ''}${api.lastMessage ? `<div class="last-msg">${escapeHtml(api.lastMessage)}</div>` : ''}${histHtml}<div class="card-actions"><button class="btn-primary btn-sm" onclick="checkOne('${api.id}')">چک کردن</button></div></article>`;
      }).join('');
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
    }
    function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#39;'); }
    function openModal(id = null) {
      editId = id;
      const form = $('#apiForm');
      form.reset();
      $('#editId').value = '';
      $('#authType').value = 'bearer';
      if (id) {
        const api = apis.find(a => a.id === id);
        if (!api) return;
        $('#modalTitle').textContent = 'ویرایش API';
        $('#editId').value = id;
        $('#name').value = api.name || '';
        $('#baseUrl').value = api.baseUrl || '';
        $('#apiKey').value = api.apiKey || '';
        $('#authType').value = api.authType || 'bearer';
        $('#testEndpoint').value = api.testEndpoint || '';
        $('#notes').value = api.notes || '';
      } else {
        $('#modalTitle').textContent = 'افزودن API جدید';
      }
      $('#modal').classList.add('open');
      $('#name').focus();
    }
    function closeModal() { $('#modal').classList.remove('open'); editId = null; }
    $('#addBtn').addEventListener('click', () => openModal());
    $('#cancelBtn').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });
    $('#apiForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        name: $('#name').value.trim(),
        baseUrl: $('#baseUrl').value.trim().replace(/\/$/, ''),
        apiKey: $('#apiKey').value.trim(),
        authType: $('#authType').value || 'bearer',
        testEndpoint: $('#testEndpoint').value.trim(),
        notes: $('#notes').value.trim()
      };
      if (!data.name || !data.baseUrl || !data.apiKey) { toast('فیلدهای ضروری را پر کنید'); return; }
      const id = $('#editId').value;
      if (id) {
        const idx = apis.findIndex(a => a.id === id);
        if (idx !== -1) apis[idx] = { ...apis[idx], ...data };
      } else {
        apis.unshift({ id: uid(), ...data, status: 'unknown', lastChecked: null, lastMessage: null, lastLatency: null, history: [], createdAt: Date.now() });
      }
      save(); render(); closeModal(); toast(id ? 'ویرایش شد' : 'اضافه شد');
    });
    window.editApi = (id) => openModal(id);
    window.deleteApi = (id) => {
      if (!confirm('این API حذف شود؟')) return;
      apis = apis.filter(a => a.id !== id);
      save(); render(); toast('حذف شد');
    };
    window.toggleKey = (id) => {
      const api = apis.find(a => a.id === id);
      if (!api) return;
      const el = document.getElementById('key-' + id);
      if (!el) return;
      if (el.dataset.shown === '1') { el.textContent = maskKey(api.apiKey); el.dataset.shown = '0'; }
      else { el.textContent = api.apiKey; el.dataset.shown = '1'; }
    };
    window.copyText = async (text) => {
      try { await navigator.clipboard.writeText(text); toast('کپی شد ✓'); }
      catch { toast('کپی ناموفق'); }
    };
    function buildRequest(api) {
      let url = api.baseUrl;
      if (api.testEndpoint) {
        if (api.testEndpoint.startsWith('http')) url = api.testEndpoint;
        else url = api.baseUrl.replace(/\/$/, '') + '/' + api.testEndpoint.replace(/^\//, '');
      }
      const headers = { 'Accept': 'application/json' };
      const auth = api.authType || 'bearer';
      if (auth === 'bearer') headers['Authorization'] = 'Bearer ' + api.apiKey;
      else if (auth === 'x-api-key') headers['x-api-key'] = api.apiKey;
      else if (auth === 'query') {
        const sep = url.includes('?') ? '&' : '?';
        url = url + sep + 'key=' + encodeURIComponent(api.apiKey);
      }
      return { url, headers };
    }
    async function performCheck(api) {
      api.status = 'checking';
      api.lastMessage = 'در حال ارسال درخواست...';
      render();
      const { url, headers } = buildRequest(api);
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      const t0 = performance.now();
      try {
        const res = await fetch(url, { method: 'GET', headers, signal: controller.signal, mode: 'cors' });
        clearTimeout(timeout);
        const latency = Math.round(performance.now() - t0);
        const text = await res.text().catch(() => '');
        const short = text.slice(0, 100).replace(/\s+/g, ' ');
        if (res.ok) {
          api.status = 'ok';
          api.lastMessage = '✓ ' + res.status + ' — ' + latency + 'ms — ' + (short || 'OK');
        } else {
          api.status = 'error';
          api.lastMessage = '✗ ' + res.status + ' ' + res.statusText + ' — ' + latency + 'ms — ' + short;
        }
        api.lastLatency = latency;
        pushHistory(api, api.status, api.lastMessage, latency, res.status);
      } catch (err) {
        clearTimeout(timeout);
        const latency = Math.round(performance.now() - t0);
        api.status = 'error';
        api.lastLatency = latency;
        if (err.name === 'AbortError') api.lastMessage = '✗ تایم‌اوت (۱۲ ثانیه) — ' + latency + 'ms';
        else if (err.message && err.message.includes('Failed to fetch')) api.lastMessage = '✗ CORS یا شبکه — ممکن است کلید معتبر باشد — ' + latency + 'ms';
        else api.lastMessage = '✗ ' + (err.message || 'خطای ناشناخته') + ' — ' + latency + 'ms';
        pushHistory(api, 'error', api.lastMessage, latency, null);
      }
      api.lastChecked = Date.now();
      save(); render();
    }
    function pushHistory(api, status, message, latency, httpStatus) {
      if (!api.history) api.history = [];
      api.history.push({ time: Date.now(), status, message: (message || '').slice(0, 200), latency, httpStatus });
      if (api.history.length > MAX_HISTORY) api.history = api.history.slice(-MAX_HISTORY);
    }
    window.checkOne = (id) => {
      const api = apis.find(a => a.id === id);
      if (api) performCheck(api);
    };
    $('#checkAllBtn').addEventListener('click', async () => {
      if (apis.length === 0) { toast('لیست خالی است'); return; }
      toast('شروع چک همه...');
      for (const api of apis) await performCheck(api);
      toast('چک همه تمام شد');
    });
    function updateAutoBtn() {
      const btn = $('#autoBtn');
      if (autoEnabled) { btn.classList.add('btn-active'); btn.textContent = '⏱ روشن'; }
      else { btn.classList.remove('btn-active'); btn.textContent = '⏱ خودکار'; }
    }
    function startAuto() {
      stopAuto();
      const minutes = Number($('#autoInterval').value) || 15;
      autoTimer = setInterval(async () => {
        if (apis.length === 0) return;
        for (const api of apis) await performCheck(api);
      }, minutes * 60 * 1000);
    }
    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    $('#autoBtn').addEventListener('click', () => {
      autoEnabled = !autoEnabled;
      if (autoEnabled) { startAuto(); toast('چک خودکار فعال شد'); }
      else { stopAuto(); toast('چک خودکار خاموش شد'); }
      updateAutoBtn(); save();
    });
    $('#autoInterval').addEventListener('change', () => { if (autoEnabled) startAuto(); save(); });
    $('#searchInput').addEventListener('input', render);
    $('#exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(apis, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'api-tokens-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('فایل دانلود شد');
    });
    $('#importBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('invalid');
          if (!confirm(data.length + ' مورد وارد شود؟ (لیست فعلی جایگزین می‌شود)')) return;
          apis = data.map(item => ({
            id: item.id || uid(), name: item.name || 'بدون نام', baseUrl: item.baseUrl || '',
            apiKey: item.apiKey || '', authType: item.authType || 'bearer',
            testEndpoint: item.testEndpoint || '', notes: item.notes || '',
            status: item.status || 'unknown', lastChecked: item.lastChecked || null,
            lastMessage: item.lastMessage || null, lastLatency: item.lastLatency || null,
            history: Array.isArray(item.history) ? item.history.slice(-MAX_HISTORY) : [],
            createdAt: item.createdAt || Date.now()
          }));
          save(); render(); toast('وارد شد');
        } catch { toast('خطا در خواندن فایل'); }
      };
      input.click();
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
    initTheme();
    load();
    updateAutoBtn();
    if (autoEnabled) startAuto();
    render();
  </script>
</body>
</html>
